          <h4 class="font-bold text-lg mb-2">${c.title}</h4>
          <p class="text-sm text-gray-500 dark:text-gray-300">${c.desc}</p>
        </div>`
              )
              .join("")
          : "";

        feather.replace();
      }

      // === DARK MODE TOGGLE ===
      function toggleDark() {
        const htmlTag = document.getElementById("htmlTag");
        if (htmlTag.classList.contains("dark")) {
          htmlTag.classList.remove("dark");
          localStorage.setItem("theme", "light");
        } else {
          htmlTag.classList.add("dark");
          localStorage.setItem("theme", "dark");
        }
      }

      // Apply saved theme on load
      document.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "dark") {
          document.getElementById("htmlTag").classList.add("dark");
        }
      });

      // === SIDEBAR TOGGLE (MOBILE) ===
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const menuToggle = document.getElementById("menuToggle");
      function closeSidebar() {
        sidebar.classList.add("-translate-x-full");
        overlay.classList.add("hidden");
      }

      if (menuToggle) {
        menuToggle.addEventListener("click", () => {
          sidebar.classList.toggle("-translate-x-full");
          overlay.classList.toggle("hidden");
        });
      }

      // Tutup sidebar otomatis saat klik link di HP
      document.querySelectorAll("#menuContainer a").forEach((link) => {
        link.addEventListener("click", () => {
          if (window.innerWidth < 768) {
            closeSidebar();
          }
        });
      });

      if (overlay) {
        overlay.addEventListener("click", () => {
          sidebar.classList.add("-translate-x-full");
          overlay.classList.add("hidden");
        });
      }

      // 🔹 Logout dengan SweetAlert2 — tombol selalu terlihat
      function logout() {
        Swal.fire({
          title: "Apakah Anda yakin ingin logout?",
          text: "Sesi Anda akan diakhiri.",
          icon: "question",
          iconColor: "#a22e33",
          showCancelButton: true,
          confirmButtonText: '<i data-feather=""></i> Ya, Logout',
          cancelButtonText: "Batal",
          confirmButtonColor: "#a22e33",
          cancelButtonColor: "#6c757d",
          reverseButtons: true,
          didOpen: () => {
            feather.replace(); // ✅ render ikon feather di popup
          },
        }).then((result) => {
          if (result.isConfirmed) {
            localStorage.clear();
            Swal.mixin({
              toast: true,
              position: "top-end",
              showConfirmButton: false,
              timer: 2000,
              timerProgressBar: true,
            })
              .fire({
                icon: "success",
                title: "Berhasil logout",
              })
              .then(() => {
                window.location.href = "../../login.html";
              });
          }
        });
      }
    </script>
    <script>
      const GAS_URL =
        "https://script.google.com/macros/s/AKfycbwnlV2oey-tD07kbGE1o-1Y4n1s2ZqepLHx_D8oszwEkKMO3NFCq8nQn4O2t64cO1wm/exec";

      const applyBtn = document.getElementById("applyDate");
      const dateInput = document.getElementById("filterDate");
      const namaPuskesmasEl = document.getElementById("namaPuskesmas");
      const totalKegiatanEl = document.getElementById("totalKegiatan");
      const totalLokasiEl = document.getElementById("totalLokasi");
      const belumLaporEl = document.getElementById("belumLapor");
      const tableBodyEl = document.getElementById("tableBody");
      const ukmCanvas = document.getElementById("ukmChart");
      const ctx = ukmCanvas ? ukmCanvas.getContext("2d") : null;
      let chartInstance = null;

      function showToast(icon, title, text) {
        if (typeof Swal !== "undefined") {
          Swal.fire({
            icon,
            title,
            text,
            toast: true,
            timer: 2500,
            position: "top-end",
            showConfirmButton: false,
          });
        } else {
          console[icon === "error" ? "error" : "log"](title, text || "");
        }
      }

      function setLoading(isLoading) {
        if (!applyBtn) return;
        if (isLoading) {
          applyBtn.disabled = true;
          applyBtn.innerHTML =
            '<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6"/></svg><span class="text-sm ml-2">Memuat...</span>';
        } else {
          applyBtn.disabled = false;
          applyBtn.innerHTML =
            '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><span class="text-sm font-medium">Terapkan</span>';
        }
      }

      async function fetchData(dateVal) {
        const url = `${GAS_URL}?action=getDataByDate&date=${encodeURIComponent(
          dateVal
        )}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Gagal mengakses GAS");
        const data = await res.json();
        if (data.error)
          throw new Error(data.message || "Data tidak ditemukan (Kode 2)");
        return data;
      }

      function renderTable(data) {
        if (!tableBodyEl) return;
        tableBodyEl.innerHTML = data
          .map((d, i) => {
            const badgeHTML = d.laporan
              ? `<span class="status-badge" style="background:#006b6d;color:#ffffff">Sudah</span>`
              : `<span class="status-badge" style="background:#a22e33;color:#ffffff">Belum</span>`;
            const tempat = d.tempat ?? "-";
            const uraian = d.uraian ?? "-";
            const ket = d.keterangan ?? (d.laporan || "-");
            return `
        <tr class="${
          i % 2 === 0
            ? "bg-[#f9fafb] dark:bg-[#3c3c48]"
            : "bg-white dark:bg-[#2f2f3b]"
        }">
          <td class="px-4 py-3">${d.no ?? i + 1}</td>
          <td class="px-4 py-3">${uraian}</td>
          <td class="px-4 py-3">${tempat}</td>
          <td class="px-4 py-3">${badgeHTML}</td>
          <td class="px-4 py-3">${ket}</td>
        </tr>
      `;
          })
          .join("");
        feather.replace(); // render ulang ikon setelah menu dimuat
      }

      function renderEmptyTable() {
        if (!tableBodyEl) return;
        tableBodyEl.innerHTML = `
      <tr class="bg-light dark:bg-[#3c3c48]">
        <td colspan="5" class="px-4 py-4 text-center italic text-gray-500 dark:text-gray-300">
          Tidak ada data kegiatan pada tanggal ini
        </td>
      </tr>
    `;
      }

      function renderChart(data) {
        if (!ctx) return;
        const lokasiCount = {};
        data.forEach((d) => {
          const tempat = d.tempat ?? "Lainnya";
          lokasiCount[tempat] = (lokasiCount[tempat] || 0) + 1;
        });
        const labels = Object.keys(lokasiCount);
        const values = Object.values(lokasiCount);
        const palette = ["#006b6d", "#f2b643", "#a22e33", "#2f2f3b", "#f9fafb"];
        const backgroundColor = labels.map(
          (_, i) => palette[i % palette.length]
        );
        try {
          if (chartInstance) chartInstance.destroy();
        } catch (e) {}
        chartInstance = new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [{ data: values, backgroundColor, borderRadius: 10 }],
          },
          options: {
            indexAxis: "y",
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
          },
        });
      }

      function clearDashboard() {
        if (namaPuskesmasEl) namaPuskesmasEl.textContent = "-";
        if (totalKegiatanEl) totalKegiatanEl.textContent = "0";
        if (totalLokasiEl) totalLokasiEl.textContent = "0";
        if (belumLaporEl) belumLaporEl.textContent = "0";
        renderEmptyTable();
        try {
          if (chartInstance) chartInstance.destroy();
        } catch (e) {}
      }

      applyBtn &&
        applyBtn.addEventListener("click", async () => {
          const dateVal = dateInput.value;
          if (!dateVal) {
            showToast("warning", "Pilih tanggal terlebih dahulu");
            return;
          }
          try {
            setLoading(true);
            const res = await fetchData(dateVal);
            if (namaPuskesmasEl)
              namaPuskesmasEl.textContent = res.puskesmas ?? "-";
            if (totalKegiatanEl)
              totalKegiatanEl.textContent = res.totalKegiatan ?? "0";
            if (totalLokasiEl)
              totalLokasiEl.textContent = res.totalLokasi ?? "0";
            if (belumLaporEl) belumLaporEl.textContent = res.belumLapor ?? "0";
            if (Array.isArray(res.data) && res.data.length > 0) {
              renderTable(res.data);
              renderChart(res.data);
            } else {
              renderEmptyTable();
              showToast("info", "Tidak ada data kegiatan untuk tanggal ini");
            }
          } catch (err) {
            clearDashboard();
            showToast("error", "Gagal", err.message || "Terjadi kesalahan");
          } finally {
            setLoading(false);
          }
        });

      clearDashboard(); // default on load
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const menuToggle = document.getElementById("menuToggle");
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        function openSidebar() {
          sidebar.classList.remove("-translate-x-full");
          overlay.classList.remove("hidden");
        }

        function closeSidebar() {
          sidebar.classList.add("-translate-x-full");
          overlay.classList.add("hidden");
        }

        if (menuToggle && sidebar && overlay) {
          menuToggle.addEventListener("click", () => {
            if (sidebar.classList.contains("-translate-x-full")) {
              openSidebar();
            } else {
              closeSidebar();
            }
          });

          overlay.addEventListener("click", closeSidebar);

          // Tutup sidebar otomatis saat klik link di HP
          document.querySelectorAll("#menuContainer a").forEach((link) => {
            link.addEventListener("click", () => {
              if (window.innerWidth < 768) {
                closeSidebar();
              }
            });
          });
        }

        // Deteksi awal mobile/desktop
        if (window.innerWidth < 768) {
          document.body.classList.add("is-mobile");
        } else {
          document.body.classList.add("is-desktop");
        }
      });
    </script>
  </body>
</html>
