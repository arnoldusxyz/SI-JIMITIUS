<script>
  feather.replace();

  // 🔐 Cek login
  if (!localStorage.getItem("loggedIn")) {
    window.location.href = "../../login.html";
  }

  const allowedRole = "Bagian Keuangan";
  const userName = localStorage.getItem("username") || "";
  const userRole = localStorage.getItem("role") || "";

  if (userRole !== allowedRole) {
    // Hapus sesi
    localStorage.clear();

    // Tampilkan toast pesan
    Swal.mixin({
      toast: true,
      position: 'top-end',
      showConfirmButton: false,
      timer: 2500,
      timerProgressBar: true,
    }).fire({
      icon: 'error',
      title: 'Akses ditolak! Silakan login kembali.'
    }).then(() => {
      // Redirect ke halaman login
      window.location.href = "../../login.html";
    });
  }

  document.getElementById("userName").textContent = userName || "User";
  document.getElementById("userRole").textContent = userRole || "Koordinator";

  // 🔹 Load konten sesuai role
  if (roleConfig[userRole]) {
    const cfg = roleConfig[userRole];
    document.getElementById("pageTitle").textContent = cfg.header;
    document.getElementById("headerTitle").textContent = cfg.header;
    document.getElementById("contentTitle").textContent = cfg.title;

    const currentPage = window.location.pathname.split("/").pop();
    const menuHTML = cfg.menu.map(m => {
      const isActive = currentPage.endsWith(m.href);
      const baseClass = "flex items-center gap-3 px-3 py-2 rounded-md transition";
      const activeClass = isActive
        ? "bg-secondary text-dark font-semibold"
        : "hover:bg-secondary hover:text-dark";
      if (isActive) {
        document.getElementById("headerTitle").textContent = m.text;
        document.getElementById("contentTitle").textContent = m.text;
      }
      return `<a href="${m.href}" class="${baseClass} ${activeClass}"><i data-feather="${m.icon}" class="w-5 h-5"></i> ${m.text}</a>`;
    }).join("");

    document.getElementById("menuContainer").innerHTML = menuHTML;
    document.getElementById("contentCards").innerHTML = cfg.cards.map(c => `
      <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-card hover:shadow-cardHover transition">
        <i data-feather="${c.icon}" class="w-10 h-10 text-secondary mb-4"></i>
        <h4 class="font-bold text-lg mb-2">${c.title}</h4>
        <p class="text-sm text-gray-500 dark:text-gray-300">${c.desc}</p>
      </div>`).join("");
    feather.replace();
  }

  // 🔹 Dark mode toggle
  const htmlTag = document.getElementById("htmlTag");
  const darkToggle = document.getElementById("darkToggle");
  function toggleDark() {
    const isDark = htmlTag.classList.toggle("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    darkToggle.innerHTML = isDark ? feather.icons.sun.toSvg() : feather.icons.moon.toSvg();
    feather.replace();
  }
  if(localStorage.getItem("theme") === "dark"){ 
    htmlTag.classList.add("dark"); 
    toggleDark(); 
  }

  // 🔹 Sidebar toggle
  const sidebar = document.getElementById("sidebar");
  const menuToggle = document.getElementById("menuToggle");
  const overlay = document.getElementById("overlay");
  function closeSidebar() {
    sidebar.classList.add("-translate-x-full");
    overlay.classList.add("hidden");
  }
  if (menuToggle) {
    menuToggle.addEventListener("click", () => {
      sidebar.classList.toggle("-translate-x-full");
      overlay.classList.toggle("hidden");
    });
  }
  if (overlay) {
    overlay.addEventListener("click", closeSidebar);
  }

  // 🔹 Logout
  function logout() {
    Swal.fire({
      title: 'Apakah Anda yakin ingin logout?',
      text: "Sesi Anda akan diakhiri.",
      icon: 'question',
      iconColor: '#a22e33',
      showCancelButton: true,
      confirmButtonText: '<i data-feather="log-out"></i> Ya, Logout',
      cancelButtonText: 'Batal',
      confirmButtonColor: '#d33',
      cancelButtonColor: '#6c757d',
      reverseButtons: true
    }).then((result) => {
      if (result.isConfirmed) {
        localStorage.clear();
        Swal.mixin({
          toast: true,
          position: 'top-end',
          showConfirmButton: false,
          timer: 2000,
          timerProgressBar: true
        }).fire({
          icon: 'success',
          title: 'Berhasil logout'
        }).then(() => {
          window.location.href = "../../login.html";
        });
      }
    });
  }
